name: qa-setup
description: Install the toolchain the verification pipeline needs, whatever the product is.

# Deliberately blind to the product. Flutter, Go, Node, a Frappe bench -- those
# are the repository's business, and its build job has already run them; by the
# time anything here executes, the product is an image. What is left is the
# machinery around the agent: a Python to run it, uv to resolve its pins, a
# browser to look with, ffmpeg to shrink what it recorded, and gh to read the
# pull request.

inputs:
  python-version:
    description: Python for the agent runtime.
    required: false
    default: "3.12"
  playwright-version:
    description: Playwright, pinned so a browser update cannot change a verdict.
    required: false
    default: "1.65.2"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Cache the browser
      id: browser-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.playwright-version }}

    - name: Install Playwright
      shell: bash
      env:
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        # The browsers are what this step is really installing, and they live in
        # one cache keyed by version. The client installed here is only what
        # downloads them; the agent installs the same version into its own
        # virtualenv, because its browser tool runs in that interpreter.
        uv pip install --system "playwright==${PLAYWRIGHT_VERSION}"
        if [ "$CACHE_HIT" = "true" ]; then
          python -m playwright install-deps chromium
        else
          python -m playwright install --with-deps chromium
        fi

        # The agent's own process runs in a virtualenv that cannot see the
        # system packages, and its browser tool imports playwright there. One
        # version, two interpreters: hand it over instead of pinning it twice,
        # because the browsers are downloaded per version and a mismatch is a
        # browser that cannot be launched.
        echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> "$GITHUB_ENV"

    - name: Ensure ffmpeg and gh
      shell: bash
      run: |
        set -euo pipefail
        # Present on the standard images; installed only when they are not, so a
        # different runner image cannot break a run silently.
        if ! command -v ffmpeg >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi
        if ! command -v gh >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh
        fi
        ffmpeg -version | head -1
        gh --version | head -1
