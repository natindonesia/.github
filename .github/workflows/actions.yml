name: actions

# The shared actions are consumed by repositories that cannot see a mistake here
# until their own CI goes red, so they get a self-test of their own. Everything
# runs against a scratch directory in dry-run mode: no bucket, no pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: publish-evidence + qa-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          # Every recording is re-encoded as an animated AVIF, because a comment
          # cannot play a video. Present on this image, not on every one, and
          # useless unless the build carries SVT-AV1.
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libsvtav1 || {
            echo "::error::this ffmpeg has no libsvtav1, so no recording can be shown inline"; exit 1
          }

      - name: Build a fixture that looks like an agent's output
        run: |
          set -euo pipefail
          mkdir -p fixtures/output/shots fixtures/output/traces
          # One pixel PNGs: the action only cares about names and content types.
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/before-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/after-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/shots/after-detail.png
          # A recording and a document: the two artefacts whose links used to be
          # left behind, because only images were repointed.
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=10 \
            -pix_fmt yuv420p fixtures/output/after-flow.mp4
          printf '%%PDF-1.4\n' > fixtures/output/login-spec.pdf
          printf '{"log":{}}\n' > fixtures/output/traces/run.har
          cat > fixtures/output/qa-report.md <<'MD'
          ## QA Report: PASS WITH ISSUES

          | state | capture |
          |---|---|
          | before | ![before](./before-home.png) |
          | after | ![after](./after-home.png "home screen") |

          Also in HTML and by bare name: <img src="../output/after-home.png">
          and ![detail](after-detail.png).

          A recording: <video src="./after-flow.mp4" controls></video> and
          [the same clip](./after-flow.mp4).

          Documents: [login spec](./login-spec.pdf), [trace](./traces/run.har).

          An external link must survive untouched: ![gh](https://example.com/x.png).
          MD

      - name: Publish with the action
        id: evidence
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: fixtures/output
          report: qa-report.md
          dry-run: "true"
          post-comment: "false"

      - name: Assert the links were repointed
        env:
          REPORT: ${{ steps.evidence.outputs.rendered-report }}
        run: |
          set -euo pipefail
          echo "uploaded=${{ steps.evidence.outputs.uploaded }}, report=${REPORT}"
          base='https://f005.backblazeb2.com/file/natindonesia-qa-screenshots/repo/'
          grep -q "${base}" "$REPORT"
          grep -q 'after-home.png "home screen"' "$REPORT"      # title preserved
          grep -q 'https://example.com/x.png' "$REPORT"          # external untouched
          grep -q 'after-detail.png' "$REPORT"                   # bare name resolved
          ! grep -q '](./' "$REPORT"                             # no local link left

      - name: Assert recordings and documents travel the same road as images
        env:
          REPORT: ${{ steps.evidence.outputs.rendered-report }}
        run: |
          set -euo pipefail
          base='https://f005.backblazeb2.com/file/natindonesia-qa-screenshots/repo/'
          # A markdown link to a video, an HTML src, a markdown link to a PDF and
          # to a trace archive: all four used to be published and then left as
          # local paths, which renders as a broken link where evidence should be.
          grep -qE "\]\\(${base}[^)]*after-flow\.mp4\\)" "$REPORT"
          grep -qE "src=\"${base}[^\"]*after-flow\.mp4\"" "$REPORT"
          grep -qE "\]\\(${base}[^)]*login-spec\.pdf\\)" "$REPORT"
          grep -qE "\]\\(${base}[^)]*traces/run\.har\\)" "$REPORT"

      - name: Publish again, this time with no report at all
        id: skipped
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: fixtures/output
          report: nowhere.md
          dry-run: "true"
          post-comment: "false"

      - name: Assert that published nothing
        run: |
          set -euo pipefail
          # No report means no evidence was produced. Posting the captures anyway
          # would dress up a run that proved nothing as one that did, and the
          # verdict is what has to carry that.
          test "${{ steps.skipped.outputs.uploaded }}" = "0"
          test ! -s "${{ steps.skipped.outputs.rendered-report }}"

      - name: Assert a run that captured nothing is not a failure to publish
        id: empty
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: nowhere
          dry-run: "true"
          post-comment: "false"

      - name: Assert it reported zero files and exited clean
        run: |
          set -euo pipefail
          test "${{ steps.empty.outputs.uploaded }}" = "0"

      - name: Assert a report that points at a missing capture fails
        run: |
          set -euo pipefail
          printf '\n![gone](./missing.png)\n' >> fixtures/output/qa-report.md
          if GITHUB_WORKSPACE="$PWD/fixtures" GITHUB_REPOSITORY=natindonesia/selftest \
               PR_NUMBER=1 GITHUB_RUN_ID=1 BUCKET=b ENDPOINT=e PUBLIC_BASE=https://example.com \
               AWS_ACCESS_KEY_ID=x AWS_SECRET_ACCESS_KEY=x DRY_RUN=true POST_COMMENT=false \
               bash actions/publish-evidence/publish.sh > /dev/null 2>&1; then
            echo "::error::a report with a broken link was published instead of rejected"
            exit 1
          fi

      - name: Score the report with the action
        uses: ./actions/qa-verdict
        with:
          pr-number: "1"
          head-sha: ${{ github.sha }}
          report-path: ${{ steps.evidence.outputs.rendered-report }}
          run-url: https://example.com/run
        env:
          DRY_RUN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every verdict branch
        run: |
          set -euo pipefail
          expect() {
            local want="$1" body="$2" not_applicable="${3:-false}"
            printf '%s' "$body" > /tmp/report.md
            local got
            got="$(REPORT_PATH=/tmp/report.md HEAD_SHA=abc GITHUB_REPOSITORY=natindonesia/selftest \
                   PR_NUMBER=1 DRY_RUN=true NOT_APPLICABLE="$not_applicable" FAIL_ON_NO_REPORT=false \
                   python3 actions/qa-verdict/verdict.py | sed 's/.*qa: \([a-z-]*\).*/\1/')"
            if [ "$got" != "$want" ]; then
              echo "::error::expected verdict '$want' for '${body:0:40}', got '$got'"
              exit 1
            fi
          }

          expect pass        '## QA Report: PASS'
          expect pass-with-issues '## QA Report: PASS WITH ISSUES'
          expect fail        '## QA Report: FAIL'
          expect partial     '## QA Report: PARTIAL'
          expect no-report   '' false
          expect not-applicable '' true

      - name: Assert only what the report refers to is uploaded
        run: |
          set -euo pipefail
          # A capture the report never mentions stays in the artifact: publishing
          # it puts pictures in the comment that the report does not stand behind.
          rm -rf fixtures/refs /tmp/refs.out && mkdir -p fixtures/refs/output
          printf '\x89PNG\r\n\x1a\n' > fixtures/refs/output/before-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/refs/output/after-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/refs/output/never-mentioned.png
          printf '## QA Report: PASS\n\nSee [the home page](./before-home.png).\n' \
            > fixtures/refs/output/qa-report.md

          GITHUB_WORKSPACE="$PWD/fixtures/refs" GITHUB_REPOSITORY=natindonesia/selftest \
            PR_NUMBER=1 GITHUB_RUN_ID=1 BUCKET=b ENDPOINT=e PUBLIC_BASE=https://example.com \
            AWS_ACCESS_KEY_ID=x AWS_SECRET_ACCESS_KEY=x DRY_RUN=true POST_COMMENT=false \
            GITHUB_OUTPUT=/tmp/refs.out EVIDENCE_DIR=output REPORT=qa-report.md \
            bash actions/publish-evidence/publish.sh > /tmp/refs.log 2>&1

          uploaded="$(sed -n 's/^uploaded=//p' /tmp/refs.out)"
          # The one file it names. Not the report itself, which is the artifact's
          # job, and not the third screenshot, which it never mentions.
          if [ "$uploaded" != "1" ]; then
            echo "::error::uploaded $uploaded object(s), expected 1 (the file it names)"
            sed -n '1,40p' /tmp/refs.log
            exit 1
          fi
          grep -q 'never-mentioned.png' /tmp/refs.log \
            && { echo "::error::a capture the report never mentions was published"; exit 1; }
          ! grep -q 'never-mentioned.png' /tmp/refs.log

      - name: Assert a referenced recording becomes its animation
        run: |
          set -euo pipefail
          rm -rf fixtures/motion /tmp/motion.out && mkdir -p fixtures/motion/output
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=10 \
            -pix_fmt yuv420p fixtures/motion/output/after-flow.mp4
          printf '## QA Report: PASS\n\n| # | evidence |\n|---|---|\n| 1 | [recording](./after-flow.mp4) |\n' \
            > fixtures/motion/output/qa-report.md

          GITHUB_WORKSPACE="$PWD/fixtures/motion" GITHUB_REPOSITORY=natindonesia/selftest \
            PR_NUMBER=1 GITHUB_RUN_ID=1 BUCKET=b ENDPOINT=e PUBLIC_BASE=https://example.com \
            AWS_ACCESS_KEY_ID=x AWS_SECRET_ACCESS_KEY=x DRY_RUN=true POST_COMMENT=false \
            GITHUB_OUTPUT=/tmp/motion.out EVIDENCE_DIR=output REPORT=qa-report.md \
            bash actions/publish-evidence/publish.sh > /dev/null 2>&1

          rendered="$(sed -n 's/^rendered-report=//p' /tmp/motion.out)"
          # One element where the link was: the animation as the picture, the
          # recording as what it opens.
          grep -qE '\[!\[recording\]\([^)]*motion/after-flow\.avif\)\]\([^)]*after-flow\.mp4\)' "$rendered" \
            || { echo "::error::the recording was not replaced by its animation"; exit 1; }
          # moov is the track box: without it the file is a still, and the gate
          # would be publishing a frozen frame it believes is motion.
          grep -aq moov fixtures/motion/output/motion/after-flow.avif \
            || { echo "::error::the inline copy is not animated"; exit 1; }

  workflow:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflows
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Assert the report template is still the one the agent is handed
        run: |
          set -euo pipefail
          # The template is shipped inside the action and copied next to the agent
          # at run time. A rename would silently drop it from the prompt, and the
          # agent would be told to start from a file that is not there.
          grep -q 'report.template.md' actions/qa-agent/agent.py
          for verdict in PASS 'PASS WITH ISSUES' FAIL PARTIAL; do
            grep -q "$verdict" actions/qa-agent/report.template.md \
              || { echo "::error::the template does not name the $verdict verdict"; exit 1; }
          done
          grep -q '### Observations' actions/qa-agent/report.template.md
          grep -q '### Judgement' actions/qa-agent/report.template.md

  harness:
    name: qa-harness
    # The pipeline dry run below calls this action at `@v1`, which proves the
    # released combination. This job runs the branch's own harness against the
    # same fixture, so a change to it is tested before it is released rather
    # than after. It is also where the two failures that only a real start can
    # find are pinned: a compose command that lost its shell variable to compose
    # interpolation, and a seed service that ran after the product started.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assert what counts as the product answering
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "actions/qa-harness")
          import harness

          assert harness.answered(200) and harness.answered(302)
          assert harness.answered(401) and harness.answered(403)
          # A product that is one site per hostname -- Frappe, anything
          # multi-tenant -- answers 404 for a hostname it does not serve. That is
          # the site-not-found page, not the product being up, and calling it up
          # hands the agent an error page to review.
          assert not harness.answered(404)
          assert not harness.answered(500) and not harness.answered(503)
          print("answered(): ok")
          PY

      - name: Start the fixture the way a repository is started
        env:
          BASE_SHA: fixture
          HEAD_SHA: fixture
        run: |
          set -euo pipefail
          python3 actions/qa-harness/harness.py up \
            --compose fixtures/app/compose.verify.yaml \
            --after-image nginx:alpine \
            --before-image nginx:alpine \
            --mode compare \
            --project qa-selftest-harness \
            --urls '{"after":"http://127.0.0.1:8200","before":"http://127.0.0.1:8100"}' \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --dry-run

      - name: Assert the seed ran once, before anything served
        run: |
          set -euo pipefail
          # The healthcheck already requires the file to read exactly `seeded`,
          # so a second run of the seed or a later one would have failed the
          # start. This checks it from where the agent stands.
          test "$(curl -fsS http://127.0.0.1:8200/site/seeded.txt)" = seeded
          test "$(curl -fsS http://127.0.0.1:8100/site/seeded.txt)" = seeded
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/evidence/input/environment.json')); assert d['mode']=='compare', d; print('environment.json:', d['probes'])"

      - name: Stop the fixture
        if: always()
        run: |
          set -euo pipefail
          python3 actions/qa-harness/harness.py down \
            --compose fixtures/app/compose.verify.yaml \
            --project qa-selftest-harness \
            --log "$RUNNER_TEMP/product.log"

  pipeline:
    name: qa-verify dry run
    # Exercises the reusable workflow end to end -- contract, compose, probe,
    # teardown -- with a two-nginx fixture standing in for a product.
    #
    # The workflow reaches its own actions through `@v1`, so this proves the
    # released combination works rather than the branch. The actions themselves
    # are proven above, from local paths.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      packages: read
    uses: ./.github/workflows/qa-verify.yml
    with:
      runner: ubuntu-latest
      config-path: fixtures/app/qa.yml
      compose-path: fixtures/app/compose.verify.yaml
      dry-run: true
