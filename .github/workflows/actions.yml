name: actions

# The shared actions are consumed by repositories that cannot see a mistake here
# until their own CI goes red, so they get a self-test of their own. Everything
# runs against a scratch directory in dry-run mode: no bucket, no pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: publish-evidence + qa-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          # The gate extracts a still from every recording, so the self-test has
          # to be able to make one. Present on some images, not on this one.
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          ffmpeg -version | head -1

      - name: Build a fixture that looks like an agent's output
        run: |
          set -euo pipefail
          mkdir -p fixtures/output/shots fixtures/output/traces
          # One pixel PNGs: the action only cares about names and content types.
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/before-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/after-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/output/shots/after-detail.png
          # A recording and a document: the two artefacts whose links used to be
          # left behind, because only images were repointed.
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=10 \
            -pix_fmt yuv420p fixtures/output/after-flow.mp4
          printf '%%PDF-1.4\n' > fixtures/output/login-spec.pdf
          printf '{"log":{}}\n' > fixtures/output/traces/run.har
          cat > fixtures/output/qa-report.md <<'MD'
          ## QA Report: PASS WITH ISSUES

          | state | capture |
          |---|---|
          | before | ![before](./before-home.png) |
          | after | ![after](./after-home.png "home screen") |

          Also in HTML and by bare name: <img src="../output/after-home.png">
          and ![detail](after-detail.png).

          A recording: <video src="./after-flow.mp4" controls></video> and
          [the same clip](./after-flow.mp4).

          Documents: [login spec](./login-spec.pdf), [trace](./traces/run.har).

          An external link must survive untouched: ![gh](https://example.com/x.png).
          MD

      - name: Publish with the action
        id: evidence
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: fixtures/output
          report: qa-report.md
          dry-run: "true"
          post-comment: "false"

      - name: Assert the links were repointed
        env:
          REPORT: ${{ steps.evidence.outputs.rendered-report }}
        run: |
          set -euo pipefail
          echo "uploaded=${{ steps.evidence.outputs.uploaded }}, report=${REPORT}"
          base='https://f005.backblazeb2.com/file/natindonesia-qa-screenshots/repo/'
          grep -q "${base}" "$REPORT"
          grep -q 'after-home.png "home screen"' "$REPORT"      # title preserved
          grep -q 'https://example.com/x.png' "$REPORT"          # external untouched
          grep -q 'after-detail.png' "$REPORT"                   # bare name resolved
          ! grep -q '](./' "$REPORT"                             # no local link left

      - name: Assert recordings and documents travel the same road as images
        env:
          REPORT: ${{ steps.evidence.outputs.rendered-report }}
        run: |
          set -euo pipefail
          base='https://f005.backblazeb2.com/file/natindonesia-qa-screenshots/repo/'
          # A markdown link to a video, an HTML src, a markdown link to a PDF and
          # to a trace archive: all four used to be published and then left as
          # local paths, which renders as a broken link where evidence should be.
          grep -qE "\]\\(${base}[^)]*after-flow\.mp4\\)" "$REPORT"
          grep -qE "src=\"${base}[^\"]*after-flow\.mp4\"" "$REPORT"
          grep -qE "\]\\(${base}[^)]*login-spec\.pdf\\)" "$REPORT"
          grep -qE "\]\\(${base}[^)]*traces/run\.har\\)" "$REPORT"

      - name: Publish again, this time saying why there is no report
        id: skipped
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: fixtures/output
          report: nowhere.md
          skip-note: No product files changed, so no agent was run.
          dry-run: "true"
          post-comment: "false"

      - name: Assert the skip note is rendered instead of the warning
        env:
          REPORT: ${{ steps.skipped.outputs.rendered-report }}
        run: |
          set -euo pipefail
          grep -q 'No product files changed, so no agent was run.' "$REPORT"
          ! grep -q 'uncontextualised' "$REPORT"

      - name: Assert a run that captured nothing is not a failure to publish
        id: empty
        uses: ./actions/publish-evidence
        with:
          pr-number: "1"
          evidence-dir: nowhere
          dry-run: "true"
          post-comment: "false"

      - name: Assert it reported zero files and exited clean
        run: |
          set -euo pipefail
          test "${{ steps.empty.outputs.uploaded }}" = "0"

      - name: Assert a report that points at a missing capture fails
        run: |
          set -euo pipefail
          printf '\n![gone](./missing.png)\n' >> fixtures/output/qa-report.md
          if GITHUB_WORKSPACE="$PWD/fixtures" GITHUB_REPOSITORY=natindonesia/selftest \
               PR_NUMBER=1 GITHUB_RUN_ID=1 BUCKET=b ENDPOINT=e PUBLIC_BASE=https://example.com \
               AWS_ACCESS_KEY_ID=x AWS_SECRET_ACCESS_KEY=x DRY_RUN=true POST_COMMENT=false \
               bash actions/publish-evidence/publish.sh > /dev/null 2>&1; then
            echo "::error::a report with a broken link was published instead of rejected"
            exit 1
          fi

      - name: Score the report with the action
        uses: ./actions/qa-verdict
        with:
          pr-number: "1"
          head-sha: ${{ github.sha }}
          report-path: ${{ steps.evidence.outputs.rendered-report }}
          run-url: https://example.com/run
        env:
          DRY_RUN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every verdict branch
        run: |
          set -euo pipefail
          expect() {
            local want="$1" body="$2" not_applicable="${3:-false}"
            printf '%s' "$body" > /tmp/report.md
            local got
            got="$(REPORT_PATH=/tmp/report.md HEAD_SHA=abc GITHUB_REPOSITORY=natindonesia/selftest \
                   PR_NUMBER=1 DRY_RUN=true NOT_APPLICABLE="$not_applicable" FAIL_ON_NO_REPORT=false \
                   python3 actions/qa-verdict/verdict.py | sed 's/.*qa: \([a-z-]*\).*/\1/')"
            if [ "$got" != "$want" ]; then
              echo "::error::expected verdict '$want' for '${body:0:40}', got '$got'"
              exit 1
            fi
          }

          expect pass        '## QA Report: PASS'
          expect pass-with-issues '## QA Report: PASS WITH ISSUES'
          expect fail        '## QA Report: FAIL'
          expect partial     '## QA Report: PARTIAL'
          expect no-report   '' false
          expect not-applicable '' true

      - name: Assert a report that embeds nothing still shows the captures
        run: |
          set -euo pipefail
          rm -rf fixtures/plain /tmp/gallery.out && mkdir -p fixtures/plain/output
          printf '\x89PNG\r\n\x1a\n' > fixtures/plain/output/before-home.png
          printf '\x89PNG\r\n\x1a\n' > fixtures/plain/output/after-home.png
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=10 \
            -pix_fmt yuv420p fixtures/plain/output/after-flow.mp4
          printf '## QA Report: PASS\n\nProse only.\n' > fixtures/plain/output/qa-report.md

          GITHUB_WORKSPACE="$PWD/fixtures/plain" GITHUB_REPOSITORY=natindonesia/selftest \
            PR_NUMBER=1 GITHUB_RUN_ID=1 BUCKET=b ENDPOINT=e PUBLIC_BASE=https://example.com \
            AWS_ACCESS_KEY_ID=x AWS_SECRET_ACCESS_KEY=x DRY_RUN=true POST_COMMENT=false \
            GITHUB_OUTPUT=/tmp/gallery.out EVIDENCE_DIR=output REPORT=qa-report.md \
            bash actions/publish-evidence/publish.sh > /dev/null 2>&1

          rendered="$(sed -n 's/^rendered-report=//p' /tmp/gallery.out)"

          # A report with no images, and captures on disk, must still show them:
          # a comment full of measurements and no images is a claim, not a look.
          grep -q 'Captures from this run, not cited' "$rendered" \
            || { echo "::error::a report with no images published no gallery"; exit 1; }
          grep -q '!\[after-home.png\]' "$rendered" \
            || { echo "::error::the gallery did not embed the capture"; exit 1; }

      - name: Assert the gallery is appended once, not twice
        run: |
          set -euo pipefail
          # The block used to be copied: the first copy landed before the comment
          # was posted and the second after it, so a video-less run published a
          # gallery nobody had seen and a re-run published two.
          rendered="$(sed -n 's/^rendered-report=//p' /tmp/gallery.out)"
          occurrences="$(grep -c '<details><summary>Captures from this run' "$rendered" || true)"
          if [ "$occurrences" -ne 1 ]; then
            echo "::error::the uncited gallery appears $occurrences time(s), expected 1"
            exit 1
          fi

      - name: Assert a recording gets a poster and is shown as a still
        run: |
          set -euo pipefail
          rendered="$(sed -n 's/^rendered-report=//p' /tmp/gallery.out)"
          # A bare mp4 link is not something a reviewer can look at, and GitHub
          # will not play one inline. The still is what makes the recording
          # visible; the link is what makes it playable.
          grep -q 'posters/after-flow.jpg' "$rendered" \
            || { echo "::error::the recording was published without a poster"; exit 1; }
          grep -qE '\[\!\[after-flow\.mp4\]\([^)]*posters/after-flow\.jpg\)\]\([^)]*after-flow\.mp4\)' "$rendered" \
            || { echo "::error::the recording is not rendered as a linking still"; exit 1; }

  workflow:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflows
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  pipeline:
    name: qa-verify dry run
    # Exercises the reusable workflow end to end -- contract, compose, probe,
    # teardown -- with a two-nginx fixture standing in for a product.
    #
    # The workflow reaches its own actions through `@v1`, so this proves the
    # released combination works rather than the branch. The actions themselves
    # are proven above, from local paths.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      packages: read
    uses: ./.github/workflows/qa-verify.yml
    with:
      runner: ubuntu-latest
      config-path: fixtures/app/qa.yml
      compose-path: fixtures/app/compose.verify.yaml
      dry-run: true
